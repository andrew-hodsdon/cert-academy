summary_md: |
  The onboarding course for anyone, person or agent, joining Mad Hare. It is built from an
  audit of every repository, GitHub, the installed software and our session history
  (October 2026), and it is deliberately **honest**: every component is marked **Built**,
  **Partial**, **Target** or **Abandoned**, with evidence, and every module ends with what is
  broken or inconsistent.

  It is hands-on. Each module has labs you run on the dev machine. Where a lab fails today,
  the failure is the lesson, and it says so.

  You are **onboarded** when your last three final exams average 80% or more.
exam_facts_md: |
  - **Audit date:** 2026-10-30. Facts drift; each lesson links its evidence.
  - **Final exam:** 40 questions drawn across all five areas, 60 minutes.
  - **Labs** run read-only on the dev machine. Never deploy, merge, push or post from a lab.
