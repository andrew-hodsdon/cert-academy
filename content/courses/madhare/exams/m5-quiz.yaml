  - key: m5-multi-merge-review-fix
    kind: multi
    domain: a5-how-we-work
    prompt_md: "Which two changes would best prevent another 'merged before cross-model review' like jbc#537? Choose two."
    choices:
      - { key: a, text: "Skip cross-model review when Andrew says to merge quickly, and note it afterwards" }
      - { key: b, text: "Branch protection on `main`, `release/*` and `epic/*` requiring a check or review that only the cross-model step posts" }
      - { key: c, text: "Answer any 'merge everything' instruction with each PR's review state (APPROVE, NOT RUN, REQUEST_CHANGES) before merging, so the approval is informed" }
      - { key: d, text: "Let the authoring model review its own change when Codex is busy" }
    answer: [b, c]
    explanation_md: |
      **b** and **c** are right. Branch protection is enforced by GitHub on every merge and doesn't
      depend on the disabled client hooks. Reporting review state turns a blanket instruction into
      an informed decision, and costs one `gh pr view` per PR.

      - **a** institutionalises the failure. Acceptance requires the review before the merge.
      - **d** is same-family self-review, which the process explicitly excludes.
    points: 1
