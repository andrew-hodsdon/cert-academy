  - key: m4-safe-in-lab
    kind: multi
    domain: a4-using-products
    prompt_md: "Which of these are safe to run in a lab? Choose two."
    choices:
      - { key: a, text: "measure-issue-work.py without flags, just to look at the numbers" }
      - { key: b, text: "sabai run --subscription-cli with a small --run-cap-usd" }
      - { key: c, text: "sabai run --synthetic --scenario success writing events to a fresh scratch directory" }
      - { key: d, text: "sabai-db-migrate inventory, which reports database_contacted: false" }
    answer: [c, d]
    explanation_md: |
      **c** and **d** are right: synthetic runs make no provider call and write only the events
      file you name, and inventory is offline (15/15 MATCH, no database contact). **a** is wrong:
      even without --sync-board it writes an evidence JSON (line 216), which is shared state.
      **b** is wrong: subscription-cli calls the model and writes audit rows to the client's Azure
      database, whatever the cap.
