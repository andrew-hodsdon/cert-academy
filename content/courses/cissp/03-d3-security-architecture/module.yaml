title: "Domain 3: Security Architecture and Engineering"
domain: d3-security-architecture
summary_md: |
  Domain 3 is 13% of the exam and the broadest technical domain. It asks you to design systems that
  stay secure by construction, then pick the right controls, crypto and physical protections as a risk
  adviser, not as an implementer. Six lessons cover the whole of the 2024 outline: secure design
  principles and the system lifecycle (**3.1**, **3.10**); security models, control selection,
  evaluation and the security capabilities of information systems (**3.2**, **3.3**, **3.4**); the
  vulnerabilities of architectures from clients to serverless, ICS and edge (**3.5**); cryptographic
  solutions and key management (**3.6**); cryptanalytic attacks (**3.7**); and site and facility design
  and controls (**3.8**, **3.9**). Finish with the Domain 3 quiz and keep taking it until you hold 80%.
