summary_md: |
  Prep for the ISC2 CISSP, built on the exam outline that has applied since **15 April 2024**
  (ISC2 has announced a new outline from 15 April 2027; if you sit after that date, check what changed).

  Work through one module per domain, take each domain quiz until you hold 80%, then sit the
  full-length practice exam. You are **exam-ready** when your last three full practice exams
  average 80% or more.

  The CISSP rewards judgement over trivia: the right answer is usually what a security
  leader advising the business would do first, not what an engineer would fix first.
exam_facts_md: |
  - **Format:** Computerized Adaptive Testing (CAT), English. 100–150 items, 3 hours.
  - **Items:** multiple choice plus advanced item types; 25 unscored pretest items are inside the first 100.
  - **Passing standard:** 700 of 1000 (ISC2 reports CAT results as pass/fail).
  - **Weights:** D1 16% · D2 10% · D3 13% · D4 13% · D5 13% · D6 12% · D7 13% · D8 10%.
  - **Experience:** five years cumulative paid work in two or more domains (one year can be waived); otherwise you become an Associate of ISC2.
  - **Outline:** effective 15 April 2024 — https://www.isc2.org/certifications/cissp/cissp-certification-exam-outline
