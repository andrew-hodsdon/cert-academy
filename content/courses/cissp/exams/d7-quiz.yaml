  # ---------- 7.14 Physical security ----------
  - key: d7-fail-safe-egress
    kind: single
    domain: d7-security-operations
    prompt_md: |
      The badge-controlled doors on a data center's only emergency exit route lose power during a
      fire. How should they behave?
    choices:
      - { key: a, text: "Fail secure, to protect the equipment inside" }
      - { key: b, text: "Fail safe (unlock), to allow people to escape" }
      - { key: c, text: "Stay in their last state until power returns" }
      - { key: d, text: "Lock and trigger an alarm to the guard desk" }
    answer: [b]
    explanation_md: |
      **b** is right: life safety comes first, so doors on egress routes fail safe.
      **a** is wrong: protecting equipment at the expense of people is never the right priority.
      **c** is wrong: a locked door staying locked traps people. **d** is wrong: an alarm doesn't
      help people who can't get out.
    points: 1
  - key: d7-tailgating-controls
    kind: multi
    domain: d7-security-operations
    prompt_md: |
      Staff routinely hold the badge-controlled door to the operations floor open for colleagues
      and visitors. Which controls **BEST** address this? **Choose two.**
    choices:
      - { key: a, text: "Install an access control vestibule (mantrap) at the entrance" }
      - { key: b, text: "Increase the height of the perimeter fence" }
      - { key: c, text: "Add more exterior lighting in the parking lot" }
      - { key: d, text: "Train staff to challenge or report tailgating and require visitors to be escorted" }
      - { key: e, text: "Replace the badge readers with PIN pads" }
    answer: [a, d]
    explanation_md: |
      **a** and **d** are right: a mantrap physically allows one person per authentication, and
      awareness plus escort rules address the human behavior.
      **b** and **c** are wrong: they are perimeter controls that don't affect an interior door.
      **e** is wrong: changing the authentication factor does nothing if the door is held open.
    points: 1

  # ---------- 7.15 Personnel safety and security ----------
  - key: d7-mfa-fatigue-response
    kind: multi
    domain: d7-security-operations
    prompt_md: |
      An employee received dozens of push notifications at 02:00 and approved one to make them
      stop. Investigation shows her password had been phished. Which measures **BEST** reduce
      this risk? **Choose two.**
    choices:
      - { key: a, text: "Increase the password length requirement" }
      - { key: b, text: "Enable number matching or move to phishing-resistant MFA such as FIDO2" }
      - { key: c, text: "Disable MFA for out-of-hours logins to reduce prompts" }
      - { key: d, text: "Train users to deny and report unexpected MFA prompts" }
      - { key: e, text: "Send push prompts by SMS instead of an app" }
    answer: [b, d]
    explanation_md: |
      **b** and **d** are right: number matching or FIDO2 stops blind approvals, and awareness of
      two-factor authentication fatigue teaches users to deny and report (an outline topic in
      7.15).
      **a** is wrong: the password was already stolen; length doesn't help. **c** is wrong: it
      removes a control. **e** is wrong: SMS is weaker and still allows approval of attacker
      sessions.
    points: 1
  - key: d7-duress-code
    kind: single
    domain: d7-security-operations
    prompt_md: |
      A guard at a vault facility is forced at gunpoint to open the vault door. Which control lets
      him comply while silently summoning help?
    choices:
      - { key: a, text: "A duress code that opens the door and triggers a silent alarm" }
      - { key: b, text: "A two-person rule for opening the vault" }
      - { key: c, text: "CCTV recording of the vault entrance" }
      - { key: d, text: "A policy that guards must refuse to open the vault under any circumstances" }
    answer: [a]
    explanation_md: |
      **a** is right: a duress code appears to work normally while alerting security, protecting
      the guard's life and summoning a response.
      **b** is wrong: it may force the attacker to threaten two people and doesn't alert anyone.
      **c** is wrong: recording helps afterwards but summons no help. **d** is wrong: it puts the
      guard's life at risk; safety comes first.
    points: 1
  - key: d7-travel-loaner-device
    kind: single
    domain: d7-security-operations
    prompt_md: |
      An executive is travelling to a country where border officials may inspect devices and hotel
      rooms are not secure. What should the security team recommend?
    choices:
      - { key: a, text: "Take the usual laptop with all files, protected by a strong password" }
      - { key: b, text: "Leave the laptop in the hotel safe when out of the room" }
      - { key: c, text: "Take a clean loaner device with full-disk encryption and minimal data, use a VPN and wipe it on return" }
      - { key: d, text: "Use only hotel Wi-Fi, because it is managed by the hotel" }
    answer: [c]
    explanation_md: |
      **c** is right: minimal data limits exposure if the device is inspected or stolen; encryption
      and VPN protect data at rest and in transit; wiping on return removes implanted threats
      (NIST SP 800-46).
      **a** is wrong: carrying all files maximizes exposure. **b** is wrong: hotel safes are not
      secure against staff or determined attackers. **d** is wrong: hotel networks should be
      treated as hostile.
    points: 1
