      structures current; a read-through would have caught this.
      **b** is wrong: RTO values don't affect a contact list. **c** is wrong: site type is a
      different problem. **d** is wrong: forensics is unrelated to continuity plan accuracy.
    points: 1
  - key: d7-tabletop-exercise
    kind: single
    domain: d7-security-operations
    prompt_md: |
      Department heads gather in a conference room. A facilitator describes a pandemic scenario in
      stages and each participant explains what their team would do. No systems are touched. What
      type of exercise is this?
    choices:
      - { key: a, text: "Full-scale exercise" }
      - { key: b, text: "Functional exercise" }
      - { key: c, text: "Parallel test" }
      - { key: d, text: "Tabletop exercise" }
    answer: [d]
    explanation_md: |
      **d** is right: a facilitated, discussion-based walk through a scenario is a tabletop
      exercise (NIST SP 800-84).
      **a** is wrong: full-scale exercises deploy real people and resources. **b** is wrong:
      functional exercises perform tasks in a simulated operational environment. **c** is wrong:
      a parallel test brings up systems at the alternate site.
