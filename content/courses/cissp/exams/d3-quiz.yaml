  - key: d3-humidity-extremes
    kind: multi
    domain: d3-security-architecture
    prompt_md: |
      Which two problems are MOST directly caused by humidity outside the recommended range in a server
      room? Choose two.
    choices:
      - { key: a, text: "Electromagnetic interference on unshielded cables" }
      - { key: b, text: "Electrostatic discharge when the air is too dry" }
      - { key: c, text: "Voltage sags from the utility" }
      - { key: d, text: "Condensation and corrosion when the air is too humid" }
      - { key: e, text: "Tailgating through the server room door" }
    answer: [b, d]
    explanation_md: |
      **b** and **d** are the two humidity risks: dry air promotes static discharge that damages
      components, and humid air leads to condensation and corrosion. **a** EMI comes from nearby electrical
      sources, not humidity. **c** sags are a power-supply problem. **e** tailgating is a physical access
      problem.
    points: 1

  - key: d3-evidence-storage-chain-of-custody
    kind: single
    domain: d3-security-architecture
    prompt_md: |
      A security team is designing a room to hold seized laptops and drives for internal investigations
      that may end in court. Which requirement is MOST important for this room?
    choices:
      - { key: a, text: "Restricted, logged access with documented chain of custody for every item moved in or out" }
      - { key: b, text: "Located next to the main server room for convenient analysis" }
      - { key: c, text: "Open to all IT staff so evidence can be examined quickly" }
      - { key: d, text: "Shared with the backup-tape library to reduce cost" }
    answer: [a]
    explanation_md: |
      **a** is right: evidence is only admissible if its integrity can be shown, which requires restricted
      access and an unbroken chain of custody. **b** proximity to servers adds nothing to evidentiary
      integrity. **c** broad access breaks the chain of custody. **d** mixing evidence with routine media
      widens access and confuses custody records.
    points: 1

  - key: d3-gas-suppression-occupied-space
    kind: single
    domain: d3-security-architecture
    prompt_md: |
      A company is choosing gaseous fire suppression for a data hall where engineers often work. Which
      option is LEAST appropriate for this occupied space?
    choices:
      - { key: a, text: "An inert-gas blend such as IG-541 with pre-discharge alarms" }
      - { key: b, text: "HFC-227ea (FM-200) designed to concentrations safe for occupied spaces" }
      - { key: c, text: "A total-flooding carbon dioxide system" }
      - { key: d, text: "FK-5-1-12 clean agent with an evacuation delay" }
    answer: [c]
    explanation_md: |
      **c** is right: CO₂ at extinguishing concentrations is lethal, so total-flooding CO₂ is reserved for
      unoccupied spaces with strict lock-out procedures; people's safety comes first. **a**, **b** and
      **d** are clean agents or inert blends designed for occupied IT spaces when used at the correct
      concentration with alarms and evacuation delays.
    points: 1
