title: "Domain 1: Security and Risk Management"
domain: d1-security-risk-management
summary_md: |
  The largest domain on the exam (16%) and the one that sets the CISSP mindset: you are a risk
  adviser to the business, not the engineer on call. Six lessons cover all twelve outline
  objectives: professional ethics and the ISC2 Code (1.1); confidentiality, integrity,
  availability, authenticity and nonrepudiation (1.2); governance, roles, due care and due
  diligence, and control frameworks (1.3); law, regulation, privacy, intellectual property and
  transborder data (1.4); investigation types (1.5); the policy hierarchy (1.6); business
  continuity requirements and the business impact analysis (1.7); personnel security (1.8);
  risk analysis, response, control types and frameworks, with a worked SLE/ALE calculation
  (1.9); threat modeling (1.10); supply chain risk (1.11); and awareness, education and
  training (1.12). Finish with the Domain 1 quiz and hold 80% before moving on.
