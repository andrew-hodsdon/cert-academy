title: "Section 1: Designing and planning a cloud solution architecture"
domain: s1-design-plan
summary_md: |
  Section 1 is the biggest slice of the Professional Cloud Architect exam (about 25%) and the one
  every other section leans on: before you provision, secure or operate anything, you have to turn
  a business story into a design. This module covers every objective in the current guide:
  **1.1** designing for business requirements (use cases, functional and non-functional
  requirements, continuity, cost optimisation, integration and data movement, build/buy/modify/
  deprecate, KPIs and ROI, compliance, observability); **1.2** designing for technical requirements
  (the Well-Architected Framework, high availability and failover, elasticity, scale, performance and
  latency, Gemini Cloud Assist, backup and recovery); **1.3** choosing network, storage and compute
  resources, including hybrid connectivity, AI services and data processing; **1.4** building a
  migration plan (assessment with Migration Center, migration methods, testing, network and
  dependency planning, licensing and financial impact); and **1.5** envisioning future improvements.
  Read the lessons in order, then take the Section 1 quiz until you hold 80%.
