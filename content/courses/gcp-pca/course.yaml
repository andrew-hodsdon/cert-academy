summary_md: |
  Prep for the Google Cloud Professional Cloud Architect exam, built on the current exam guide
  (case studies v6.1: **Altostrat Media, Cymbal Retail, EHR Healthcare, KnightMotives Automotive**).
  Older case studies (Mountkirk Games, TerramEarth, Helicopter Racing League, Dress4Win) are retired.

  One module per exam section, then a module that walks each case study the way the exam
  does. Take each section quiz until you hold 80%, then the full practice exam. You are
  **exam-ready** when your last three full practice exams average 80% or more.
exam_facts_md: |
  - **Format:** 50–60 multiple choice and multiple select questions, 2 hours, online or at a test centre.
  - **Case studies:** each exam uses 2 of the 4; they make up roughly 20–30% of the questions.
  - **Weights:** §1 ~25% · §2 ~17.5% · §3 ~17.5% · §4 ~15% · §5 ~12.5% · §6 ~12.5%.
  - **Cost:** $200 plus tax. Valid 2 years; renewal exam is 25 questions in 1 hour on one case study.
  - **Guide:** https://cloud.google.com/learn/certification/cloud-architect
