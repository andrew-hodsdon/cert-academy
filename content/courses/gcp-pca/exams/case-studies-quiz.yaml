  - key: cs-ehr-hybrid-connectivity
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      **Case study: EHR Healthcare.** EHR's legacy insurer integrations will stay on-premises
      for several years. Applications moving to GKE must reach them with secure,
      high-performance, highly available connectivity, and EHR's colocation facility is in a
      metro with a Google Cloud Interconnect location. What should you recommend?
    choices:
      - { key: a, text: "Expose the insurer systems on public IP addresses and restrict access with firewall rules on the colocation edge." }
      - { key: b, text: "Redundant Dedicated Interconnect connections in separate edge availability domains, with HA VPN as an interim and backup path." }
      - { key: c, text: "A single Classic VPN tunnel with static routes." }
      - { key: d, text: "Migrate the insurer integrations to Compute Engine so that no hybrid link is needed." }
    answer: [b]
    explanation_md: |
      **b** is right. Dedicated Interconnect gives private, high-bandwidth connectivity, and
      redundancy across edge availability domains supports high availability. HA VPN can
      carry traffic while the circuits are provisioned and back them up afterwards.

      - **a** is wrong. Exposing health-related systems on the public internet fails the
        "secure" requirement and gives no predictable performance.
      - **c** is wrong. A single tunnel is a single point of failure with limited throughput.
      - **d** is wrong. The case says there's no plan to move these integrations now.
    points: 1
  - key: cs-ehr-availability-design
    kind: multi
    domain: s1-design-plan
    prompt_md: |
      **Case study: EHR Healthcare.** EHR must provide at least 99.9% availability for every
      customer-facing system. The web tier runs on GKE and uses MySQL. Which two design
      choices most directly support this target? (Choose two.)
    choices:
      - { key: a, text: "Run the web tier on one large zonal cluster with bigger nodes for headroom." }
      - { key: b, text: "Put all customer-facing pods on Spot VM node pools to free budget for more replicas." }
      - { key: c, text: "Run the web tier on regional GKE clusters that spread nodes across multiple zones." }
      - { key: d, text: "Use Cloud SQL for MySQL in a high-availability (regional) configuration with automatic failover." }
      - { key: e, text: "Add a read replica in the same zone as the primary database and fail over to it by hand." }
    answer: [c, d]
    explanation_md: |
      **c** and **d** are right. Both remove single-zone failure points, for compute and for
      the database, which is the minimum shape for a 99.9% commitment.

      - **a** is wrong. Bigger nodes in one zone still fail together if the zone fails.
      - **b** is wrong. Spot VMs can be preempted at any time, which is unsuitable for a
        customer-facing availability target.
      - **e** is wrong. A same-zone replica shares the zone's fate, and manual failover is slow.
    points: 1
  - key: cs-ehr-ad-identity
    kind: single
    domain: s3-security-compliance
    prompt_md: |
      **Case study: EHR Healthcare.** EHR manages its staff in Microsoft Active Directory and
      wants them to sign in to Google Cloud with their existing credentials. AD must remain the
      single source of truth for joiners and leavers. What should you do?
    choices:
      - { key: a, text: "Deploy Managed Service for Microsoft Active Directory and have staff sign in to the console with it." }
      - { key: b, text: "Create matching user accounts by hand in Cloud Identity and ask staff to keep the passwords the same." }
      - { key: c, text: "Provision users and groups from AD into Cloud Identity with Google Cloud Directory Sync, and configure SAML single sign-on against AD FS or Entra ID." }
      - { key: d, text: "Share a small set of service account keys among staff, mapped to AD groups." }
    answer: [c]
    explanation_md: |
      **c** is right. This is Google's documented federation pattern. Directory Sync keeps
      users and groups aligned with AD, and SSO authenticates against AD, so AD stays
      authoritative.

      - **a** is wrong. Managed Microsoft AD provides domain controllers for AD-dependent
        workloads in Google Cloud. It isn't how console sign-in is federated.
      - **b** is wrong. Manual accounts drift from AD and break joiner and leaver control.
      - **d** is wrong. Shared service account keys destroy individual accountability and are
        a serious security risk.
    points: 1
  - key: cs-ehr-baa-first
    kind: single
    domain: s3-security-compliance
    prompt_md: |
      **Case study: EHR Healthcare.** EHR is about to move protected health information for
      U.S. customers into Google Cloud. What should EHR do **first** to maintain regulatory
      compliance?
    choices:
      - { key: a, text: "Enable CMEK on every storage service before any data is moved." }
      - { key: b, text: "Review and accept Google Cloud's Business Associate Agreement, and limit health data to the products it covers." }
      - { key: c, text: "Request a SOC 2 report from Google and file it as proof of HIPAA compliance." }
      - { key: d, text: "Turn on Security Command Center and treat its findings as the compliance sign-off." }
    answer: [b]
    explanation_md: |
      **b** is right. HIPAA requires a Business Associate Agreement before a cloud provider
      handles PHI, and the BAA covers only listed products. This is the contractual
      prerequisite, and the configuration work follows it.

      - **a** is wrong. CMEK may be a useful control, but HIPAA doesn't require it and it
        doesn't replace the BAA.
      - **c** is wrong. A SOC 2 report is useful assurance, but it isn't a BAA or HIPAA
        compliance.
      - **d** is wrong. Security Command Center finds risks. It isn't a compliance sign-off
        and doesn't create the contractual basis.
    points: 1
  - key: cs-ehr-central-log-retention
    kind: single
    domain: s3-security-compliance
    prompt_md: |
      **Case study: EHR Healthcare.** EHR needs consistent logging and log retention across
      every project and environment, with audit logs kept for a regulated period and protected
      from deletion, even by project owners. What should you configure?
    choices:
      - { key: a, text: "Default _Default log buckets in every project, with owners reminded to keep them." }
      - { key: b, text: "A weekly script that exports each project's logs to an analyst's personal bucket." }
      - { key: c, text: "Log-based metrics in each project, deleting the raw logs after 7 days to save cost." }
      - { key: d, text: "An aggregated sink at the organization (or environment folder) level routing logs to a central log bucket with the required retention, locked so retention can't be reduced." }
    answer: [d]
    explanation_md: |
      **d** is right. An aggregated sink captures logs from every current and future project
      consistently, and a locked bucket enforces retention that project owners can't shorten.

      - **a** is wrong. Per-project defaults are inconsistent and can be changed by owners.
      - **b** is wrong. Personal buckets break separation of duties, and weekly scripts leave
