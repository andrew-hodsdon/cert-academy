      secured access to the ERP, and caching and quotas protect the legacy system from load.

      - **a** is wrong. It requires new equipment at dealerships, which the case rules out.
      - **b** is wrong. Direct database credentials are insecure and tightly couple dealers to
        the ERP schema.
      - **c** is wrong. New workstations are new equipment, and installed apps are harder to
        update.
    points: 1
  - key: cs-knightmotives-crm-disposition
    kind: single
    domain: s1-design-plan
    prompt_md: |
      **Case study: KnightMotives Automotive.** KnightMotives needs a comprehensive CRM to track
      customer interactions and personalise experiences. Its engineering capacity is already
      committed to the in-vehicle platform and autonomous driving. What should the architect
      recommend?
    choices:
      - { key: a, text: "Adopt a SaaS CRM and integrate it with vehicle, dealer and ERP data through APIs." }
      - { key: b, text: "Build a custom CRM on GKE so that it can be tailored exactly to automotive needs." }
      - { key: c, text: "Extend the outdated ERP with CRM screens." }
      - { key: d, text: "Postpone CRM until the autonomous-driving programme is complete." }
    answer: [a]
    explanation_md: |
      **a** is right. CRM is a commodity capability, so the right workload disposition is
      **buy** and integrate, which keeps scarce engineers on the differentiators.

      - **b** is wrong. Building a commodity system diverts engineers from the strategic
        work.
      - **c** is wrong. Extending an outdated system deepens the technical debt the case
        complains about.
      - **d** is wrong. CRM is part of the stated dealer and customer requirements, so
        postponing it fails a business goal.
    points: 1
  - key: cs-knightmotives-upskilling
    kind: single
    domain: s4-analyze-optimize
    prompt_md: |
      **Case study: KnightMotives Automotive.** Most of KnightMotives' IT staff know only
      on-premises and mainframe systems, and business and technical teams rarely talk. The
      company wants to upskill employees and improve that communication as it adopts a hybrid
      cloud strategy. What should you recommend **first**?
    choices:
      - { key: a, text: "Replace the existing IT staff with an outsourced cloud provider." }
      - { key: b, text: "Assess current skills, then run a structured training and certification plan with a cross-functional cloud centre of excellence that owns shared KPIs, starting on a low-risk pilot workload." }
      - { key: c, text: "Give every engineer Owner access to a sandbox project and let them learn on their own." }
      - { key: d, text: "Postpone the cloud programme until enough experienced cloud engineers have been hired." }
    answer: [b]
    explanation_md: |
      **b** is right. A skills assessment drives a targeted plan, a cross-functional centre of
      excellence with shared KPIs fixes the communication gap, and a pilot gives safe
      hands-on practice. This is the change-management approach §4.2 expects.

      - **a** is wrong. It abandons the upskilling objective and loses domain knowledge.
      - **c** is wrong. Unstructured access with broad roles isn't a plan and ignores least
        privilege.
      - **d** is wrong. It stalls the transformation and ignores the stated aim of upskilling
        existing staff.
    points: 1
