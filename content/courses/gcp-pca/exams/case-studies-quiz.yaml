      - { key: b, text: "Make every change by hand in the console of each cluster, during a weekly change window." }
      - { key: c, text: "Define infrastructure in Terraform modules, register clusters to a fleet, and use Config Sync with Policy Controller so every cluster reconciles to configuration and policy in Git." }
      - { key: d, text: "Use one very large cluster for all environments, separated only by namespaces, to avoid drift." }
    answer: [c]
