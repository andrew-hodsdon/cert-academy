slug: case-studies-quiz
ordinal: 17
title: "Case studies quiz"
kind: quiz
draw: 16
time_limit_min: 40
pass_pct: 80
instructions_md: |
  16 questions drawn at random from a bank of 40: ten for each of the four v6.1 case studies
  (Altostrat Media, Cymbal Retail, EHR Healthcare, KnightMotives Automotive). You have 40
  minutes, the same pace as the real exam. Keep the case-study PDFs open in another tab, as the
  real exam shows the case text beside these questions.

  Multiple-select questions say how many to choose and score only when every choice is right.
  Pass mark 80%. Every question also feeds the full practice exam under the section it really
  tests.
questions:
  # ---------------------------------------------------------------- Altostrat Media
  - key: cs-altostrat-autoclass-back-catalogue
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat's documentary back catalogue is several
      petabytes in Cloud Storage. Most titles are rarely watched, but any of them can suddenly
      trend after a news event and be streamed heavily for weeks. Leadership wants lower
      storage cost without the operations team tuning rules by hand. What should you do?
    choices:
      - { key: a, text: "Add a lifecycle rule that moves every object to Archive storage 30 days after creation." }
      - { key: b, text: "Enable Autoclass on the bucket that holds the back catalogue." }
      - { key: c, text: "Move the back catalogue to Filestore Basic HDD and mount it on the GKE content platform." }
      - { key: d, text: "Keep the catalogue in Standard storage and put Cloud CDN in front of it." }
    answer: [b]
    explanation_md: |
      **b** is right. Autoclass moves each object to colder classes as it goes unread and back
      to Standard when it's read again, with no retrieval or early-deletion charges for those
      transitions. That fits unpredictable access and needs no manual tuning.

      - **a** is wrong. Archive charges retrieval fees on every read and has a 365-day minimum
        storage duration, so a title that trends becomes expensive and stays cold.
      - **c** is wrong. Filestore is file storage priced for performance, not a cheaper home
        for petabytes of rarely read media, and it adds capacity management.
      - **d** is wrong. Cloud CDN reduces latency and egress for hot content but doesn't
        reduce the at-rest cost of petabytes of idle objects.
    points: 1
  - key: cs-altostrat-hybrid-ingestion-link
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat's on-premises ingestion system uploads
      several terabytes of raw video to Google Cloud every day until it is retired. The
      technical requirements call for secure, high-performance hybrid connectivity, and the
      executive statement makes reliability a top priority. What should you recommend?
    choices:
      - { key: a, text: "A single Classic VPN tunnel from the ingestion site to the content VPC." }
      - { key: b, text: "Direct Peering with Google at the nearest edge location." }
      - { key: c, text: "Dedicated Interconnect in a redundant topology, with HA VPN as a backup path." }
      - { key: d, text: "Uploads over the public internet using signed URLs from the ingestion servers." }
    answer: [c]
    explanation_md: |
      **c** is right. Dedicated Interconnect gives private, high-bandwidth, SLA-backed
      connectivity into the VPC, and a redundant topology plus an HA VPN backup meets the
      reliability priority.

      - **a** is wrong. A single Classic VPN tunnel is limited in throughput and is a single
        point of failure, so it fails both "high-performance" and reliability.
      - **b** is wrong. Direct Peering reaches Google's public services rather than giving
        private access to your VPC, and it carries no SLA.
      - **d** is wrong. Signed URLs secure individual uploads, but the public internet gives
        no predictable bandwidth or latency for terabytes a day.
    points: 1
  - key: cs-altostrat-central-cicd
    kind: single
    domain: s4-analyze-optimize
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat runs Kubernetes both on GKE and on-premises.
      Each team currently builds images on its own Jenkins server and deploys with `kubectl`.
      The technical requirements call for modern CI/CD for containerised deployments with a
      centralised management platform. Which approach best meets the requirement?
    choices:
      - { key: a, text: "Register all clusters to a GKE fleet; build with Cloud Build into Artifact Registry; promote releases with Cloud Deploy; enforce attested images with Binary Authorization." }
      - { key: b, text: "Standardise every team on the same Jenkins plugins and keep one Jenkins server per cluster." }
      - { key: c, text: "Give developers cluster-admin on every cluster so they can deploy directly without waiting for a pipeline." }
      - { key: d, text: "Replace all clusters with Compute Engine managed instance groups deployed by startup scripts." }
    answer: [a]
    explanation_md: |
      **a** is right. A fleet gives one management plane across cloud and on-premises
      clusters. Cloud Build, Artifact Registry and Cloud Deploy give one managed pipeline with
      promotion and rollback, and Binary Authorization secures the supply chain.

      - **b** is wrong. Many Jenkins servers are still decentralised and self-managed. Plugin
        standardisation doesn't create central management.
      - **c** is wrong. It removes the pipeline and breaks least privilege, which makes
        releases less reliable, not more.
      - **d** is wrong. It abandons the Kubernetes environments the requirements say must be
        provided on-premises and in the cloud.
    points: 1
  - key: cs-altostrat-auditable-moderation
    kind: multi
    domain: s3-security-compliance
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat will use pretrained APIs and Gemini to flag
      inappropriate content, plus a small custom classifier for one category. Regulators and
      creators must be able to challenge removals, so the technical requirements say the AI
      must be auditable and its decisions explainable. Which two actions best meet this?
      (Choose two.)
    choices:
      - { key: a, text: "Record every moderation decision (asset reference, model and version, scores, threshold, outcome, reviewer) in BigQuery with a defined retention period." }
      - { key: b, text: "Disable Data Access audit logs on the moderation project to reduce log volume and cost." }
      - { key: c, text: "Use Explainable AI feature attributions for the custom classifier, and route borderline or appealed items to a human reviewer." }
      - { key: d, text: "Delete flagged assets automatically as soon as the score passes the threshold, so harmful content is never served." }
      - { key: e, text: "Retrain the classifier nightly on the latest flags, overwriting the previous model version each time." }
    answer: [a, c]
    explanation_md: |
      **a** and **c** are right. A durable decision record makes each outcome reconstructable
      for audit. Feature attributions explain the custom model's decisions, and human review
      covers disputed and borderline cases where pretrained and generative scores alone
      aren't an explanation.

      - **b** is wrong. Removing audit logs reduces auditability, the opposite of the
        requirement.
      - **d** is wrong. Silent automatic deletion leaves nothing to audit or appeal.
        Quarantine plus a record is the safer pattern.
      - **e** is wrong. Overwriting model versions makes it impossible to say which model made
        a past decision.
    points: 1
  - key: cs-altostrat-support-agent
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat wants 24/7 natural-language support that
      answers questions about its catalogue, subscriptions and help articles, and can look up
      a viewer's account. The team has no ML engineers and wants answers grounded in
      Altostrat's own content. What should you use?
    choices:
      - { key: a, text: "Train a language model from scratch on TPUs using Altostrat's help articles." }
      - { key: b, text: "Deploy an open-weight model on a GKE GPU node pool and paste help articles into each prompt by hand." }
      - { key: c, text: "Use the Natural Language API to classify each question and return a canned answer per category." }
      - { key: d, text: "Build an Agent Builder agent on Gemini, grounded on the catalogue and help content, with a tool that calls Altostrat's account API." }
    answer: [d]
    explanation_md: |
      **d** is right. Agent Builder provides a managed, grounded conversational agent on
      Gemini with tools for actions, so it meets 24/7 support, grounding and personalisation
      with no model operations.

      - **a** is wrong. Training a model from scratch needs ML skills, large data and time
        the team doesn't have, and it still wouldn't be grounded in live content.
      - **b** is wrong. It adds GPU infrastructure to run, and manual context stuffing isn't
        a scalable grounding approach.
      - **c** is wrong. Classification with canned answers isn't natural-language
        conversation and can't personalise.
    points: 1
  - key: cs-altostrat-automatic-summaries
    kind: single
    domain: s1-design-plan
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat wants a short summary generated for every new
      podcast episode and news video as soon as it lands in Cloud Storage, stored with the
      asset's metadata for search and analytics. The team wants the least operational
      overhead. Which design should you choose?
    choices:
      - { key: a, text: "A Cloud Storage object-finalised event triggers a Cloud Run function that sends the media to Gemini and writes the summary to BigQuery and the content record." }
      - { key: b, text: "A nightly cron job on a Compute Engine VM lists the bucket and summarises new files with a self-hosted model." }
      - { key: c, text: "Editors write summaries by hand in a shared spreadsheet that is loaded into BigQuery weekly." }
      - { key: d, text: "A Dataproc cluster runs continuously, polling the bucket and summarising files with a Spark job." }
    answer: [a]
    explanation_md: |
      **a** is right. It's event-driven and serverless (nothing runs when nothing is
      uploaded), Gemini accepts audio and video directly, and results land where search and
      analytics already live.

      - **b** is wrong. It delays summaries until the nightly run and adds a VM and a model to
        operate.
      - **c** is wrong. The requirement is automatic summarisation, so manual work doesn't
        meet it.
      - **d** is wrong. A permanently running cluster for per-file tasks is costly and heavy
        to operate compared with an event trigger.
    points: 1
  - key: cs-altostrat-monitoring-modernise
    kind: multi
    domain: s6-operations-excellence
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat uses Cloud Monitoring plus self-run
      Prometheus servers, and alerts go mainly to email. Outages have gone unnoticed for
      hours. Which two changes best improve reliability while reducing operational burden?
      (Choose two.)
    choices:
      - { key: a, text: "Add more people to the alert email distribution list." }
      - { key: b, text: "Move Prometheus metrics to Google Cloud Managed Service for Prometheus, keeping existing PromQL queries and dashboards." }
      - { key: c, text: "Run a larger self-managed Prometheus cluster with Thanos for long-term storage in every region." }
      - { key: d, text: "Define SLOs for key user journeys and route alerting policies to on-call notification channels such as a paging tool." }
      - { key: e, text: "Export all logs to Cloud Storage and review them weekly for errors." }
    answer: [b, d]
    explanation_md: |
      **b** and **d** are right. Managed Service for Prometheus keeps the familiar
      Prometheus model without running servers, and SLO-based alerts routed to on-call tools
      make sure someone acts promptly on user-visible problems.

      - **a** is wrong. More email recipients doesn't fix ignored email alerts and adds noise.
      - **c** is wrong. It increases the self-managed footprint, the opposite of reducing
        burden.
      - **e** is wrong. Weekly log review is retrospective and can't shorten outage detection.
    points: 1
  - key: cs-altostrat-chatbot-prompt-injection
    kind: single
    domain: s3-security-compliance
    prompt_md: |
      **Case study: Altostrat Media.** During testing of Altostrat's support chatbot, users
      persuaded it to ignore its instructions and output offensive text, and one prompt tried
      to extract another viewer's email address. Which control should you add?
    choices:
      - { key: a, text: "Increase the model's temperature so responses vary and are harder to manipulate." }
      - { key: b, text: "Put Cloud Armor in front of the chatbot's load balancer with the OWASP preconfigured rules." }
      - { key: c, text: "Screen prompts and responses with Model Armor for prompt injection, jailbreaks, harmful content and sensitive data." }
      - { key: d, text: "Rewrite the system prompt to tell the model never to follow user instructions that change its role." }
    answer: [c]
    explanation_md: |
      **c** is right. Model Armor screens both prompts and responses for prompt injection,
      jailbreak attempts, harmful content and sensitive data, independent of the model.

      - **a** is wrong. Temperature changes randomness, not safety, and can make behaviour
        less predictable.
      - **b** is wrong. Cloud Armor protects against web attacks and DDoS at layer 7. It
        doesn't understand LLM prompt semantics.
      - **d** is wrong. System-prompt wording helps, but it's exactly what jailbreaks are
        designed to bypass. It isn't a control on its own.
    points: 1
  - key: cs-altostrat-content-trends
    kind: multi
    domain: s1-design-plan
    prompt_md: |
      **Case study: Altostrat Media.** Altostrat extracts topics, people and labels from every
      asset and already holds viewing behaviour in BigQuery. Editors want to see which topics
      are rising and to forecast demand to inform content strategy, with minimal new
      infrastructure. Which two steps should you take? (Choose two.)
    choices:
      - { key: a, text: "Copy the viewing data into Cloud SQL for MySQL so that analysts can use familiar SQL tools." }
      - { key: b, text: "Store the metadata in Memorystore for Redis so that trend queries return quickly." }
      - { key: c, text: "Write the extracted metadata to BigQuery tables that join to the existing viewing data." }
      - { key: d, text: "Load the metadata into Bigtable and query it with ad hoc SQL joins against viewing data." }
      - { key: e, text: "Use BigQuery ML forecasting models and Looker dashboards on the joined data." }
    answer: [c, e]
    explanation_md: |
      **c** and **e** are right. Keeping metadata beside the behaviour data in BigQuery
      avoids new silos, and BigQuery ML plus dashboards gives forecasts and insight in SQL
      with no new platform to run.

      - **a** is wrong. Cloud SQL is an operational database, not an analytics warehouse for
        large-scale aggregation, and copying data creates a silo.
      - **b** is wrong. Memorystore is an in-memory cache, not an analytics store.
      - **d** is wrong. Bigtable is a wide-column store for key-based access at scale. It
        isn't designed for ad hoc relational joins.
    points: 1
  - key: cs-altostrat-archive-migration
    kind: single
    domain: s1-design-plan
    prompt_md: |
      **Case study: Altostrat Media.** As part of the migration plan, Altostrat must move about
      400 TB from its on-premises archive file servers to Cloud Storage. A 10 Gbps
      Interconnect is already in place, new files keep arriving during the migration, and the
      team wants scheduled, incremental copies with integrity checks and no custom scripts.
      What should you use?
    choices:
      - { key: a, text: "Transfer Appliance, shipped once, followed by manual copies of any new files." }
      - { key: b, text: "A cron job running `gcloud storage cp` on each file server." }
      - { key: c, text: "Database Migration Service with a continuous migration job." }
      - { key: d, text: "Storage Transfer Service with transfer agents installed on-premises, run on a schedule." }
    answer: [d]
    explanation_md: |
      **d** is right. Storage Transfer Service with on-premises agents is managed, schedulable
      and incremental, verifies data, and can use the existing Interconnect bandwidth. 400 TB
      at 10 Gbps is a matter of days to weeks, not months.

      - **a** is wrong. Transfer Appliance suits cases where the network can't move the data
        in time. Here it can, and the manual follow-up copies don't meet the "no custom
        scripts" constraint.
      - **b** is wrong. It's a custom script with no central scheduling, monitoring or
        verification.
      - **c** is wrong. Database Migration Service migrates databases, not file archives.
    points: 1
  # ---------------------------------------------------------------- Cymbal Retail
  - key: cs-cymbal-attribute-generation
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      **Case study: Cymbal Retail.** Supplier data arrives as short titles, inconsistent
      descriptions and product photos. Cymbal needs product attributes derived from all three
      that match each category's existing attribute fields and allowed values. What is the
      best approach?
    choices:
      - { key: a, text: "Use the Cloud Vision API's label detection on the photos and store the labels as attributes." }
      - { key: b, text: "Send the title, description and images to Gemini with the category's attribute schema in the prompt, and use structured output so responses must match that schema." }
      - { key: c, text: "Ask Gemini for a free-text paragraph and extract attributes from it with regular expressions." }
      - { key: d, text: "Fine-tune a custom model on all historical products before attempting any prompting." }
    answer: [b]
    explanation_md: |
      **b** is right. A multimodal model uses all three inputs, and structured output
      constrains the response to Cymbal's fields and allowed values, which is the "align with
      the catalogue structure" requirement.

      - **a** is wrong. Generic image labels ignore the text inputs and don't map to Cymbal's
        attribute schema.
      - **c** is wrong. Free text parsed with regex is brittle and produces inconsistent
        values, the error-prone process Cymbal wants to leave behind.
      - **d** is wrong. Fine-tuning first is costly and slow. Prompting with schemas is the
        documented starting point, and tuning comes only if that falls short.
    points: 1
  - key: cs-cymbal-image-variations
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      **Case study: Cymbal Retail.** From one supplier photo of a sofa, Cymbal wants versions
      in four other fabric colours, a lifestyle background instead of the warehouse floor, and
      a "New" badge overlay, without running its own GPU infrastructure. What should you use?
    choices:
      - { key: a, text: "Imagen on Agent Platform for mask-based editing, background replacement and colour variants, compositing the overlay in the pipeline." }
      - { key: b, text: "An open-source diffusion model on a Compute Engine GPU VM managed by the catalogue team." }
      - { key: c, text: "The Cloud Vision API's image properties feature to recolour the sofa." }
      - { key: d, text: "Ask suppliers to send a separate photo shoot for every colour and background." }
    answer: [a]
    explanation_md: |
      **a** is right. Imagen is a managed image generation and editing model that supports
      mask-based edits and background changes, so no GPUs need to be run.

      - **b** is wrong. It violates the "no GPU infrastructure" constraint and adds operations.
      - **c** is wrong. Vision's image properties *detects* dominant colours. It doesn't edit
        images.
      - **d** is wrong. It's the manual, slow process the requirement exists to remove.
    points: 1
  - key: cs-cymbal-hitl-review
    kind: multi
    domain: s1-design-plan
    prompt_md: |
      **Case study: Cymbal Retail.** Cymbal's associates must be able to approve, reject or
      edit every gen AI suggestion before it reaches the product catalogue. Which two design
      elements meet this requirement? (Choose two.)
    choices:
      - { key: a, text: "Write generated attributes, descriptions and images to a staging store with a pending status, and publish to the catalogue only on approval." }
      - { key: b, text: "Publish suggestions directly when the model's confidence is above 0.9 and review only the rest." }
      - { key: c, text: "Send a weekly CSV of published changes to associates so they can report errors." }
      - { key: d, text: "Build a review web app on Cloud Run, protected by Identity-Aware Proxy, that lets associates approve, reject or edit each suggestion." }
      - { key: e, text: "Let the model overwrite catalogue fields and keep a backup table for rollback." }
    answer: [a, d]
    explanation_md: |
      **a** and **d** are right. Separating generation from publication with a staging status
      and giving associates a secured UI to act on each item is exactly a human-in-the-loop
      control.

      - **b** is wrong. Auto-publishing any subset skips the required human review.
      - **c** is wrong. Reviewing after publication is too late, because customers have
        already seen the content.
      - **e** is wrong. Rollback is remediation, not review before update.
    points: 1
  - key: cs-cymbal-product-discovery
    kind: single
    domain: s1-design-plan
    prompt_md: |
      **Case study: Cymbal Retail.** Cymbal's storefront search queries its relational
      databases by product name and category, so a search for "something warm for winter
      hiking" returns nothing useful. Cymbal wants natural-language queries to return highly
      relevant products across its very large catalogue. What should you recommend?
    choices:
      - { key: a, text: "Add full-text indexes to the MySQL product tables and tune the queries." }
      - { key: b, text: "Build a custom embeddings index on GKE and maintain the ranking model in-house." }
      - { key: c, text: "Adopt Search for commerce (Discovery AI for retail), ingesting the catalogue and user events, and call it from the site and the virtual agents." }
      - { key: d, text: "Put Memorystore in front of the database to make the existing searches faster." }
    answer: [c]
    explanation_md: |
      **c** is right. Search for commerce is Google's managed Discovery AI for retail. It
      understands natural-language intent and learns from Cymbal's own user events, and one
      engine can serve both the site and the conversational agents.

      - **a** is wrong. Full-text indexes match keywords. They don't understand intent such
        as "warm for winter hiking".
      - **b** is wrong. It could work, but it builds and runs what a managed product already
        provides, which adds operational burden.
      - **d** is wrong. Caching makes irrelevant results faster. It doesn't make them
        relevant.
    points: 1
  - key: cs-cymbal-call-centre-cost
    kind: single
    domain: s1-design-plan
    prompt_md: |
      **Case study: Cymbal Retail.** Many calls reach Cymbal's human agents only because
      customers couldn't finish an order online, after which an agent keys the order in by
      hand. Cymbal wants to reduce call-centre staffing costs while keeping customers
      satisfied. What should you recommend?
    choices:
      - { key: a, text: "Add more menu options to the IVR so callers can route themselves more precisely." }
      - { key: b, text: "Outsource the call centre to a lower-cost region and keep the manual order entry." }
      - { key: c, text: "Replace phone support with an email form that customers fill in." }
      - { key: d, text: "Deploy a Conversational Agents (Dialogflow CX) virtual agent on voice and web, with tools to search products and place orders through Cymbal's order API, handing off to a human with context when needed." }
    answer: [d]
    explanation_md: |
      **d** is right. A virtual agent that can find products and place the order completes
      the exact calls that today need a human to key orders, and the hand-off protects
      satisfaction for the rest.

      - **a** is wrong. More IVR options still end with a human keying the order.
      - **b** is wrong. It may cut the hourly rate but keeps the manual, error-prone process
        and doesn't use the conversational commerce the case calls for.
      - **c** is wrong. It degrades customer experience and still needs people to process the
        forms.
    points: 1
  - key: cs-cymbal-customer-data-protection
    kind: multi
    domain: s3-security-compliance
    prompt_md: |
      **Case study: Cymbal Retail.** Conversations with Cymbal's virtual agents are stored for
      analytics, and some customers read out card numbers and addresses. Cymbal must handle
      customer data securely and in line with industry regulations. Which two controls should
      you apply? (Choose two.)
    choices:
      - { key: a, text: "Grant the analytics team the Owner role on the data project so they can audit access themselves." }
      - { key: b, text: "Use Sensitive Data Protection to inspect and de-identify card numbers and other PII in transcripts before they're stored or logged." }
      - { key: c, text: "Rely on Google's default encryption at rest as the complete PCI DSS control." }
      - { key: d, text: "Disable Data Access audit logs on the data project so PII never appears in logs." }
      - { key: e, text: "Place the projects that hold customer data and the AI services in a VPC Service Controls perimeter." }
    answer: [b, e]
    explanation_md: |
      **b** and **e** are right. De-identification keeps card numbers and PII out of stored
      transcripts and analytics, which shrinks compliance scope. A service perimeter guards
      the remaining sensitive data against exfiltration, even by someone with stolen
      credentials.

      - **a** is wrong. Owner is far beyond least privilege for analysts.
      - **c** is wrong. Encryption at rest is necessary but is only one of many controls. It
        doesn't stop card data spreading into transcripts.
      - **d** is wrong. Removing audit logs destroys the evidence compliance needs. Redact the
        data instead.
    points: 1
  - key: cs-cymbal-database-migration
    kind: single
    domain: s1-design-plan
    prompt_md: |
      **Case study: Cymbal Retail.** To cut data-centre hosting costs, Cymbal will move its
      on-premises MySQL and SQL Server catalogue databases to Google Cloud. The applications
      should change as little as possible and the cutover window must be short. What should
      you recommend?
    choices:
      - { key: a, text: "Migrate both to Cloud SQL (MySQL and SQL Server editions) using Database Migration Service with continuous replication, then cut over." }
      - { key: b, text: "Rewrite both schemas for Bigtable and bulk-load nightly exports." }
      - { key: c, text: "Install MySQL and SQL Server on Compute Engine VMs and restore last night's backups during a weekend outage." }
      - { key: d, text: "Export both databases to CSV and load them into BigQuery as the new operational store." }
    answer: [a]
    explanation_md: |
      **a** is right. Cloud SQL supports both engines unchanged, so the application changes
      very little. Database Migration Service keeps the target in sync so the final cutover
      is short, and the managed service removes the hardware and admin costs.

      - **b** is wrong. Bigtable isn't relational, so this is a rewrite, not a minimal-change
        move.
      - **c** is wrong. It keeps all the database administration, and a backup-restore with a
        weekend outage isn't a short cutover.
      - **d** is wrong. BigQuery is an analytics warehouse, not an OLTP database for a
        storefront.
    points: 1
  - key: cs-cymbal-file-integrations
    kind: single
    domain: s4-analyze-optimize
    prompt_md: |
      **Case study: Cymbal Retail.** Supplier SFTP drops feed a nightly ETL batch. When a file
      is malformed, the batch fails and staff spend the morning finding and fixing it by hand.
      Suppliers won't stop sending files this year. How should you redesign the process to
      reduce manual error handling?
    choices:
      - { key: a, text: "Keep the nightly batch but run it twice a night so failures are noticed sooner." }
      - { key: b, text: "Land supplier files in Cloud Storage, trigger processing per file through Eventarc and Pub/Sub into Dataflow, and route invalid records to a dead-letter topic with alerting." }
      - { key: c, text: "Ask every supplier to switch to a new REST API immediately and stop accepting files." }
      - { key: d, text: "Move the SFTP server and ETL scripts unchanged to a Compute Engine VM." }
    answer: [b]
    explanation_md: |
      **b** is right. Per-file, event-driven processing isolates bad files, and dead-letter
      handling with alerts turns a failed nightly batch into a targeted, visible exception.
      It still accepts files, so suppliers don't have to change.

      - **a** is wrong. It's the same fragile batch, just run more often.
      - **c** is wrong. It ignores the stated constraint that suppliers will keep sending
        files.
      - **d** is wrong. Rehosting moves the problem without changing the process.
    points: 1
  - key: cs-cymbal-observability-consolidation
    kind: single
    domain: s6-operations-excellence
    prompt_md: |
      **Case study: Cymbal Retail.** Cymbal monitors with Grafana, Nagios and Elastic, each run
      by a different team, and incidents are often spotted by customers first. As workloads
      move to GKE, Cymbal wants proactive monitoring with less tooling to maintain, and its
      engineers want to keep their Grafana dashboards. What should you recommend?
    choices:
      - { key: a, text: "Run all three tools on a GKE cluster so that they share infrastructure." }
      - { key: b, text: "Replace them with uptime checks only, because GKE restarts failed pods automatically." }
      - { key: c, text: "Adopt Google Cloud Observability with Managed Service for Prometheus, point Grafana at it, and define alerting policies on SLOs routed to on-call." }
      - { key: d, text: "Export all metrics to BigQuery and review them in a daily report." }
    answer: [c]
    explanation_md: |
      **c** is right. It consolidates on a managed observability stack, keeps Grafana
      dashboards working through the Prometheus-compatible query API, and makes alerting
      proactive.

      - **a** is wrong. It keeps three tools to maintain and does nothing for alerting.
      - **b** is wrong. Uptime checks alone miss latency, errors and saturation, and
        self-healing doesn't replace monitoring.
      - **d** is wrong. A daily report is retrospective, not proactive.
    points: 1
  - key: cs-cymbal-enrichment-at-scale
    kind: multi
    domain: s2-manage-provision
    prompt_md: |
      **Case study: Cymbal Retail.** Cymbal must enrich a backlog of several million existing
      products and then about 20,000 new supplier items each day, without performance problems
      as the catalogue grows. Which two approaches should you use? (Choose two.)
    choices:
      - { key: a, text: "Run Gemini batch inference over the backlog from Cloud Storage or BigQuery." }
      - { key: b, text: "Process new supplier items as they arrive with event-driven online requests from a serverless pipeline (Pub/Sub and Cloud Run)." }
      - { key: c, text: "Call the online Gemini endpoint synchronously in a single loop from one VM for all items." }
      - { key: d, text: "Self-host an open model on always-on GPU VMs sized for the backlog peak." }
      - { key: e, text: "Generate attributes in the shopper's browser at page-view time." }
    answer: [a, b]
    explanation_md: |
      **a** and **b** are right. Batch inference handles very large, non-urgent volumes at a
      lower price and without online quota pressure. Event-driven online calls keep new items
      flowing, and the serverless pipeline scales with arrivals.

      - **c** is wrong. One synchronous loop is slow, fragile and quota-bound at this volume.
      - **d** is wrong. Always-on GPUs sized for a one-off peak waste money and add
        operations.
      - **e** is wrong. Generating at page view adds latency, skips human review and repeats
        work for every visitor.
    points: 1
  # ---------------------------------------------------------------- EHR Healthcare
