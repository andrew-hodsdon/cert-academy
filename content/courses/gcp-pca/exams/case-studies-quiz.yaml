  - key: cs-ehr-actionable-alerting
    kind: single
    domain: s6-operations-excellence
    prompt_md: |
      **Case study: EHR Healthcare.** EHR's alerts go to a shared mailbox and are often ignored.
      Leadership wants proactive action on system performance. What should you change **first**?
    choices:
      - { key: a, text: "Define SLOs for customer-facing services and create alerting policies on SLO burn rate and key symptoms, routed to an on-call paging channel." }
      - { key: b, text: "Add more threshold alerts on CPU and memory for every VM and container." }
      - { key: c, text: "Change the email subject lines to say URGENT." }
      - { key: d, text: "Increase log retention so engineers can investigate after customers report problems." }
