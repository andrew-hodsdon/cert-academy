  - key: s2-notebooklm-policy-qa
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      EHR Healthcare's compliance team wants staff to ask questions about 200 internal policy
      documents and get answers grounded only in those documents, with audio overviews for
      onboarding. Data must stay under enterprise controls, and there's no budget to build an
