  - key: s2-model-armor-prompt-injection
    kind: single
    domain: s2-manage-provision
    prompt_md: |
      Cymbal Retail's shopping assistant uses a Model Garden model. Security testing found that
      users can inject instructions that make it reveal internal data, and some responses contain
      customer phone numbers. The team wants a managed, model-agnostic control that screens both
      prompts and responses. What should they add?
    choices:
      - { key: a, text: "Cloud Armor WAF rules on the load balancer" }
      - { key: b, text: "A higher temperature setting, so responses are less predictable" }
      - { key: c, text: "Model Armor, with prompt-injection detection and Sensitive Data Protection filters" }
      - { key: d, text: "VPC Service Controls around the project" }
    answer: [c]
    explanation_md: |
      **c** is right. Model Armor screens prompts and responses for prompt injection and
      jailbreaks, sensitive data (through Sensitive Data Protection), malicious URLs and harmful
      content, regardless of the model.

      **a** is wrong because Cloud Armor inspects HTTP requests for web attacks and doesn't
      understand LLM prompts or responses. **b** is wrong because temperature changes randomness,
      not safety. **d** is wrong because VPC Service Controls stop data exfiltration through
      Google APIs, not leaks through the model's answers.
    points: 1

  - key: s2-grounding-catalogue-and-web
    kind: multi
    domain: s2-manage-provision
    prompt_md: |
      A support assistant built on Gemini must answer from Cymbal's **current** product catalogue
      and policies (which change daily), cite its sources, and also handle questions about
      recent public events such as carrier delays. Which two techniques meet these needs?
      **Choose two.**
    choices:
      - { key: a, text: "Ground responses in Cymbal's own data through Agent Search or a RAG Engine corpus" }
      - { key: b, text: "Supervised-tune the model weekly on the catalogue" }
      - { key: c, text: "Ground responses with Google Search for fresh public information" }
      - { key: d, text: "Raise max output tokens so that answers include more detail" }
      - { key: e, text: "Train a custom language model from scratch on Agent Platform" }
    answer: [a, c]
    explanation_md: |
      **a** and **c** are right. Grounding in your own data retrieves the current catalogue at
      query time and returns citations, and grounding with Google Search adds fresh public facts.

      **b** is wrong because tuning bakes in knowledge that is stale within a day, and gives no
      citations. **d** is wrong because length doesn't improve accuracy. **e** is wrong because
      training from scratch is enormously costly and still isn't current.
    points: 1
