    choices:
      - { key: a, text: "A custom RAG application on Agent Runtime, with RAG Engine and a web front end" }
      - { key: b, text: "Fine-tuning a Gemini model on the 200 documents" }
      - { key: c, text: "Agent Search with a website search widget on the public site" }
      - { key: d, text: "NotebookLM Enterprise, with the policy documents as notebook sources" }
